<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Gracious Line Gadgets</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/order.css">
  <style>
    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .table-responsive table { min-width: 600px; }
  </style>
</head>
<body>

  <div class="container container-wide">
    <div class="card">
      
      <!-- Top Navigation -->
      <div class="dash-nav">
        <div class="dash-brand">
          <img src="../img/gracious.jpg" alt="Logo" onerror="this.style.display='none'">
          <div>
            <h2 class="brand-title" style="font-size: 1.25rem;">GRACIOUS LINE</h2>
            <div class="brand-subtitle" style="font-size: 0.65rem;">GADGETS & SALES DASHBOARD</div>
          </div>
        </div>

        <div class="user-info">
          <span class="user-badge">👤 Logged in as: <strong id="userBadgeEmail">Admin</strong></span>
          <button class="btn-logout" onclick="logout()">LOGOUT</button>
        </div>
      </div>

      <!-- Navigation Links -->
      <div class="filter-bar-container">
        <div>
          <span class="filter-title">📌 Page: </span>
          <span style="color: var(--gold-primary); font-weight: 700; font-size: 0.85rem;">Orders</span>
        </div>

        <div class="time-filter-group">
          <a href="../overview/overview.html" class="time-filter-btn">Overview</a>
          <a href="../analytic/analytics.html" class="time-filter-btn">Analytics</a>
          <a href="orders.html" class="time-filter-btn active">Orders</a>
        </div>
      </div>

      <!-- Page Content -->
      <div class="table-box" style="margin-top: 0;">
        <h3 style="font-size: 0.85rem; color: var(--gold-primary); margin-bottom: 12px;">PALUWAL</h3>
        <div class="time-filter-group" style="display: flex; width: 100%; gap: 4px; box-sizing: border-box;">
          <a href="orders.html" class="time-filter-btn" style="flex: 1 1 0%; min-width: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 2px; font-size: clamp(0.62rem, 1.8vw, 0.78rem); word-break: break-word;">Inventory</a>
          
          <a href="funds.html" class="time-filter-btn " style="flex: 1 1 0%; min-width: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 2px; font-size: clamp(0.62rem, 1.8vw, 0.78rem); word-break: break-word;">Funds</a>
          
          <a href="paluwal.html" class="time-filter-btn active" style="flex: 1 1 0%; min-width: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 2px; font-size: clamp(0.62rem, 1.8vw, 0.78rem); word-break: break-word;">Paluwal</a>
          
          <a href="geremoney.html" class="time-filter-btn" style="flex: 1 1 0%; min-width: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 2px; font-size: clamp(0.62rem, 1.8vw, 0.78rem); word-break: break-word;">GereMoney</a>
        </div>

<!-- SEARCH & ANALYZE BAR CONTAINER -->
<div style="margin-top: 20px; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; width: 100%;">
  <!-- Search Field -->
  <input 
    type="text" 
    id="tableSearchInput" 
    placeholder="🔍 Search product or customer..." 
    style="flex: 1; padding: 8px 12px; font-size: clamp(0.75rem, 2vw, 0.85rem); background: #1a1a1a; color: #fff; border: 1px solid rgba(226, 178, 88, 0.3); border-radius: 6px; outline: none; box-sizing: border-box;"
  />
  
  <!-- Analyze Button (Awtomatikong lalabas kapag may itinype) -->
  <button 
    id="analyzeSearchBtn" 
    onclick="window.openSearchAnalyticsModal()" 
    style="display: none; padding: 8px 12px; background: var(--gold-primary, #e2b258); color: #000; font-weight: 700; border: none; border-radius: 6px; font-size: clamp(0.7rem, 1.8vw, 0.8rem); cursor: pointer; white-space: nowrap;">
    📊 Analyze
  </button>
</div>

<!-- FIXED HEIGHT & SCROLLABLE TABLE CONTAINER -->
<div class="table-responsive" style="max-height: 380px; overflow-y: auto; width: 100%;">
  <table style="width: 100%; table-layout: fixed; border-collapse: collapse;">
    <thead style="position: sticky; top: 0; background: #121212; z-index: 2;">
      <tr>
        <th style="width: 20%; padding: 6px 2px; font-size: 0.7rem; text-align: center;">Product</th>
        <th style="width: 20%; padding: 6px 2px; font-size: 0.7rem; text-align: center;">Capital</th>
        <th style="width: 20%; padding: 6px 2px; font-size: 0.7rem; text-align: center;">Selling</th>
        <th style="width: 20%; padding: 6px 2px; font-size: 0.7rem; text-align: center;">Customer</th>
        <th style="width: 20%; padding: 6px 2px; font-size: 0.7rem; text-align: center;">Avr Sold</th>
      </tr>
    </thead>
    <tbody id="analyticsList">
      <!-- Dynamic Rows via JS -->
    </tbody>
  </table>
</div> <!-- Inilagay ang kulang na closing div tag dito -->

<!-- ANALYTICS MODAL POPUP -->
<div id="analyticsSummaryModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;">
  <div style="background: #181818; border: 1px solid rgba(226, 178, 88, 0.4); border-radius: 12px; max-width: 420px; width: 100%; padding: 20px; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative;">
    <!-- Close Button -->
    <button onclick="window.closeAnalyticsModal()" style="position: absolute; top: 12px; right: 12px; background: transparent; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer;">✕</button>
    
    <!-- Title matched to JS (analyticsModalTitle) -->
    <h3 id="analyticsModalTitle" style="margin-top: 0; color: var(--gold-primary, #e2b258); font-size: 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">
      📈 Search Analytics
    </h3>

    <!-- Dynamic Content Body matched to JS (analyticsModalBody) -->
    <div id="analyticsModalBody" style="font-size: 0.82rem; line-height: 1.6; margin-top: 10px;">
      <!-- Dynamic Data Content from JavaScript -->
    </div>
  </div>
</div>

        
      </div>

    </div>
  </div>

</body>
<script type="module" src="../js/paluwal.js"></script>
</html>
