<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gracious Line - Reset Password</title>
   <!-- Favicon / Tab Logo Image -->
  <link rel="icon" type="image/jpeg" href="../img/gracious.jpg">
  <link rel="apple-touch-icon" href="../img/gracious.jpg">

  <!-- Open Graph Meta Tags (Para sa preview picture kapag inilink ang page) -->
  <meta property="og:title" content="Analytics - Gracious Line Gadgets">
  <meta property="og:description" content="Gadgets, Accessories, and Services Analytics Dashboard">
  <meta property="og:image" content="../img/gracious.jpg">

  <!-- Image Preload (Para mabilis mag-load ang logo image sa page) -->
  <link rel="preload" as="image" href="../img/gracious.jpg">
  <link rel="stylesheet" href="../css/login.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Dynamic Ambient Glow Effects -->
  <div class="glow-orb orb-gold"></div>
  <div class="glow-orb orb-red"></div>

  <!-- Offline Banner -->
  <div id="offlineBar" class="offline-banner">
    <span class="offline-icon">⚠️</span>
    <span>No internet connection detected.</span>
  </div>

  <div class="portal-container">
    <div class="login-card">
      
      <!-- Top Brand Section -->
      <div class="brand-section">
        <div class="logo-emblem-container">
          <div class="emblem-glow-ring"></div>
          <img src="../img/gracious.jpg" alt="Gracious Line Logo" class="brand-logo-img" />
        </div>
        
        <h1 class="brand-name">RESET PASSWORD</h1>
        <p class="brand-tagline">ENTER YOUR REGISTERED EMAIL ADDRESS</p>
      </div>

      <!-- Form Interface -->
      <form id="resetForm" class="auth-form" onsubmit="event.preventDefault();">
        
        <!-- Email Input -->
        <div class="form-group">
          <label for="resetEmail">Email Address</label>
          <div class="input-container">
            <span class="input-icon">✉️</span>
            <input type="email" id="resetEmail" placeholder="admin@graciousline.com" required autocomplete="off" />
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btnResetSubmit" class="btn-login">
          <span id="btnResetSpinner" class="btn-spinner" style="display: none;"></span>
          <span id="btnResetText">SEND RESET LINK</span>
        </button>

      </form>

      <!-- Back to Login Link -->
      <div class="login-footer">
        <p><a href="/index.html" class="forgot-pass-link" style="font-size: 0.72rem; font-weight: 600;">← Back to Sign In</a></p>
      </div>

    </div>
  </div>

  <!-- Firebase ES Module Script -->
  <script type="module" src="../js/reset-password-ui.js"></script>
</body>
</html>
