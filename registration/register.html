<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Gracious Line Gadgets</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <div class="card">
      
      <!-- Brand Circuit Header with Image Logo -->
      <div class="circuit-header">
        <img src="gracious.jpg" alt="Gracious Line Logo" class="brand-logo" onerror="this.style.display='none'">
        <h1 class="brand-title">Gracious Line</h1>
        <div class="brand-subtitle">GADGETS, ACCESSORIES, AND SERVICES</div>
        <div class="brand-est">Est. 2024</div>
      </div>

      <div class="form-title">CREATE NEW ACCOUNT</div>

      <!-- Alert Notification -->
      <div id="alertBox" class="alert-box"></div>

      <!-- Registration Form -->
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" class="form-control" placeholder="Juan Dela Cruz" required>
        </div>

        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" class="form-control" placeholder="name@email.com" required>
        </div>

        <div class="form-group">
          <label for="regPhone">Phone Number</label>
          <input type="tel" id="regPhone" class="form-control" placeholder="09123456789" required>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-gold">CREATE ACCOUNT</button>
      </form>

      <div class="link-text" style="margin-top: 15px;">
        Already have an account? <a href="login.html">SIGN IN</a>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Redirect to dashboard if already logged in
    checkLoginAuth();
  </script>
</body>
</html>
