<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gracious Line Gadgets</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <div class="card">
      
      <!-- Brand Circuit Header with Image Logo -->
      <div class="circuit-header">
        <img src="gracious.jpg" alt="Gracious Line Logo" class="brand-logo" onerror="this.style.display='none'">
        <h1 class="brand-title">Gracious Line</h1>
        <div class="brand-subtitle">GADGETS, ACCESSORIES, AND SERVICES</div>
        <div class="brand-est">Est. 2024</div>
      </div>

      <div class="form-title">SIGN IN TO YOUR ACCOUNT</div>

      <!-- Alert Notification -->
      <div id="alertBox" class="alert-box"></div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="enter your email..." required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-gold">SIGN IN</button>
      </form>

      <div class="link-text">
        <a href="#">Forgot Password?</a>
      </div>

      <div class="link-text" style="margin-top: 12px;">
        Don't have an account? <a href="register.html">REGISTER HERE</a>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Redirect to dashboard if already logged in
    checkLoginAuth();
  </script>
</body>
</html>
